name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Check the frontend
        run: cd web && npm run check

      # The kernel-tuning tests only exercise their real paths on Linux, which
      # is what this runner is.
      - name: Build for every release target
        run: make dist
