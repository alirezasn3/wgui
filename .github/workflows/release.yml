# Builds and publishes the Linux binaries whenever a version tag is pushed.
# `make release TAG=v2.0.0` is the usual way to trigger it.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so `git describe` sees the tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Test
        run: |
          go test ./...
          cd web && npm run check

      - name: Build
        run: make dist

      # The release notes are this version's section of CHANGELOG.md, which is
      # also what a running panel shows before it installs the update. The
      # install instructions follow a marker the panel cuts at, since they are
      # no news to a server that already has wgui.
      - name: Write the release notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if ($2 == tag) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > section.md
          if ! grep -q '[^[:space:]]' section.md; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          {
            cat section.md
            echo
            echo '<!-- wgui:install -->'
            sed -e "s|@REPO@|$GITHUB_REPOSITORY|g" -e "s|@TAG@|$GITHUB_REF_NAME|g" <<'EOF'
          ## Install

          Nothing else is needed — no Go, no Node, no database server. Binaries
          are built for `amd64` and `arm64`; the first line picks the right one.

          ```bash
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          BASE=https://github.com/@REPO@/releases/download/@TAG@

          curl -fsSLO $BASE/wgui-linux-$ARCH
          curl -fsSLO $BASE/SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS

          sudo install -Dm755 wgui-linux-$ARCH /opt/wgui/wgui
          curl -fsSL $BASE/config.example.json | sudo tee /opt/wgui/config.json > /dev/null
          sudo nano /opt/wgui/config.json      # set interfaceName and the subnet

          cd /opt/wgui && sudo ./wgui --install   # writes, enables and starts the service
          ```

          Then import `/opt/wgui/admin.conf` on your own machine, bring the
          tunnel up, and open the panel at the server's tunnel address.

          **Upgrading:** an admin can install this from the panel's Settings page
          on any server already running v2.1.0 or later. By hand, replace the
          binary and `sudo systemctl restart wgui`; the database and certificate
          are left alone and the schema migrates itself.
          EOF
          } > notes.md
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wgui-linux-amd64
            dist/wgui-linux-arm64
            dist/config.example.json
            dist/SHA256SUMS
          body_path: notes.md
          generate_release_notes: true
